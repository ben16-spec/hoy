<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esmiringhoy</title>
<script>document.documentElement.classList.add("js");setTimeout(function(){if(!window.__rev)document.querySelectorAll("figure").forEach(function(f){f.classList.add("in","ready")})},4500)</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;800&display=swap">
<style>
:root{--bg:#E8ECEF;--ink:#0F161C;--muted:#5C6B78;--line:#C9D1D8;--accent:#2E7D4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1114;--ink:#E6EBEF;--muted:#8896A2;--line:#243038;--accent:#6BC28D}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1114;--ink:#E6EBEF;--muted:#8896A2;--line:#243038;--accent:#6BC28D}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px 64px}
h1{font-weight:800;font-size:clamp(3rem,15vw,9.5rem);letter-spacing:-.05em;line-height:.9;margin:0 0 18px;word-break:break-word}
.mask{display:block;overflow:hidden;padding-bottom:.18em;margin-bottom:-.18em}
.sub{max-width:34ch;color:var(--muted);font-size:1.1rem;margin:0 0 28px;border-left:3px solid var(--accent);padding-left:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.filters button{font:inherit;font-weight:500;color:var(--ink);background:none;border:1px solid var(--line);border-radius:99px;padding:7px 18px;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible,figure:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.gallery{columns:2;column-gap:16px}
figure{margin:0 0 16px;break-inside:avoid;position:relative;cursor:zoom-in;overflow:hidden;border-radius:6px;background:var(--line);transition:opacity .35s,transform .35s}
figure[hidden]{display:none}
figure.off{opacity:0;transform:scale(.94)!important}
figure img{display:block;width:100%;height:auto}
figcaption{position:absolute;left:0;bottom:0;right:0;padding:34px 14px 12px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.68))}
figcaption b{font-weight:500;font-size:1rem}
.tag{font-size:.78rem;border:1px solid rgba(255,255,255,.65);border-radius:99px;padding:2px 11px;white-space:nowrap;backdrop-filter:blur(4px)}
footer{margin-top:32px;color:var(--muted);font-size:.9rem}
.curtain{display:none}
#lb{position:fixed;inset:0;background:rgba(5,8,10,.94);display:none;align-items:center;justify-content:center;z-index:20;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:80vh;border-radius:4px}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:1.6rem;width:46px;height:46px;border-radius:50%;cursor:pointer}
#lb button:focus-visible{outline:2px solid #fff}
#prev{left:12px;top:50%}#next{right:12px;top:50%}#x{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
#cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;color:#fff}
#cap b{display:block;font-weight:500;font-size:1.15rem}
#cap span{font-size:.85rem;opacity:.7}
@media (max-width:620px){.gallery{columns:1}}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wipe{to{transform:translateY(-100%)}}
@keyframes ctext{50%{opacity:1}to{opacity:0;transform:translateY(-30px)}}
@media (prefers-reduced-motion:no-preference){
.curtain{display:flex;position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--bg);align-items:center;justify-content:center;font-weight:800;font-size:clamp(2rem,9vw,6rem);letter-spacing:-.05em;pointer-events:none;animation:wipe 1s cubic-bezier(.76,0,.24,1) 1s forwards}
.curtain span{animation:ctext 1s ease 1s forwards}
.mask>span{display:block;animation:up 1s cubic-bezier(.2,.8,.2,1) 1.6s both}
.sub,.filters{animation:fade .9s ease 2.1s both}
.js figure{transform:perspective(900px) rotateX(14deg) translateY(40px);transform-origin:50% 0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .35s}
.js figure img{clip-path:inset(0 0 100% 0);transform:scale(1.25);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),transform 1.5s cubic-bezier(.2,.8,.2,1)}
.js figure.in{transform:none}
.js figure.in img{clip-path:inset(0);transform:none}
.js figure.ready{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,opacity .35s}
.js figure.ready img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.js figure.ready:hover img{transform:scale(1.05)}
}
</style>
</head>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="x" aria-label="Close">×</button><button id="prev" aria-label="Previous photo">‹</button>
  <img id="big" alt=""><button id="next" aria-label="Next photo">›</button>
  <div id="cap"><b id="capT"></b><span id="capG"></span></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var all=[].slice.call(document.querySelectorAll("figure")),btns=[].slice.call(document.querySelectorAll(".filters button")),
  lb=$("lb"),big=$("big"),cap=$("cap"),i=0,cur=null,closing=false,
  rm=matchMedia("(prefers-reduced-motion: reduce)").matches,E="cubic-bezier(.2,.8,.2,1)",DK="rgba(5,8,10,.94)",CL="rgba(5,8,10,0)";
  function vis(){return all.filter(function(f){return !f.hidden})}
  function setActive(f){if(cur)cur.style.visibility="";cur=f;cur.style.visibility="hidden"}
  function flip(f){var r=big.getBoundingClientRect();return{transform:"translate("+(f.left-r.left)+"px,"+(f.top-r.top)+"px) scale("+(f.width/r.width)+","+(f.height/r.height)+")"}}
  function label(f,delay){
    $("capT").textContent=f.dataset.title;$("capG").textContent=f.dataset.tag;
    if(!rm)cap.animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:500,delay:delay,easing:E,fill:"backwards"});
  }
  function show(n){
    var list=vis(),k=(n+list.length)%list.length,fig=list[k],im=fig.querySelector("img"),open=lb.classList.contains("on"),dir=n>i?1:-1;
    i=k;setActive(fig);
    if(!open){
      big.style.opacity=0;big.src=im.src;big.alt=im.alt;lb.classList.add("on");label(fig,350);
      big.decode().catch(function(){}).then(function(){
        big.style.opacity="";
        if(rm)return;
        big.animate([flip(im.getBoundingClientRect()),{transform:"none"}],{duration:650,easing:E});
        lb.animate({backgroundColor:[CL,DK]},{duration:450});
      });
    }else if(rm){big.src=im.src;big.alt=im.alt;label(fig,0)}
    else{
      big.animate([{transform:"none",opacity:1},{transform:"translateX("+(-70*dir)+"px)",opacity:0}],{duration:180,easing:"ease-in"}).onfinish=function(){
        big.src=im.src;big.alt=im.alt;label(fig,100);
        big.animate([{transform:"translateX("+(70*dir)+"px)",opacity:0},{transform:"none",opacity:1}],{duration:380,easing:E});
      };
    }
  }
  function hide(){
    if(!lb.classList.contains("on")||closing)return;
    function done(){lb.classList.remove("on");big.getAnimations().forEach(function(a){a.cancel()});lb.getAnimations().forEach(function(a){a.cancel()});if(cur){cur.style.visibility="";cur=null}closing=false}
    if(rm){done();return}
    closing=true;
    var a=big.animate([{transform:"none"},flip(vis()[i].querySelector("img").getBoundingClientRect())],{duration:500,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"});
    lb.animate({backgroundColor:[DK,CL]},{duration:500,fill:"forwards"});
    cap.animate({opacity:[1,0]},{duration:250,fill:"forwards"});
    a.onfinish=done;
  }
  all.forEach(function(f){
    f.addEventListener("click",function(){show(vis().indexOf(f))});
    f.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();show(vis().indexOf(f))}});
    f.addEventListener("transitionend",function(e){if(e.target===f&&e.propertyName==="transform"&&f.classList.contains("in")){f.style.transitionDelay="";f.classList.add("ready")}});
  });
  if(!rm&&matchMedia("(hover:hover)").matches)all.forEach(function(f){
    f.addEventListener("pointermove",function(e){var r=f.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;f.style.setProperty("--rx",((.5-y)*7)+"deg");f.style.setProperty("--ry",((x-.5)*9)+"deg")});
    f.addEventListener("pointerleave",function(){f.style.setProperty("--rx","0deg");f.style.setProperty("--ry","0deg")});
  });
  btns.forEach(function(b){b.addEventListener("click",function(){
    var f=b.dataset.f;
    btns.forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false")});
    all.forEach(function(fig){
      fig.classList.add("in");
      if(f==="all"||fig.dataset.tag===f){if(fig.hidden){fig.hidden=false;void fig.offsetWidth}fig.classList.remove("off")}
      else{fig.classList.add("off");setTimeout(function(){if(fig.classList.contains("off"))fig.hidden=true},rm?0:350)}
    });
  })});
  $("x").onclick=hide;
  $("prev").onclick=function(){show(i-1)};
  $("next").onclick=function(){show(i+1)};
  lb.addEventListener("click",function(e){if(e.target===lb)hide()});
  document.addEventListener("keydown",function(e){if(!lb.classList.contains("on"))return;if(e.key==="Escape")hide();if(e.key==="ArrowLeft")show(i-1);if(e.key==="ArrowRight")show(i+1)});
  function startReveal(){
    window.__rev=1;
    var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1}):null;
    all.forEach(function(f,n){f.style.transitionDelay=rm?"":(n%2*.15)+"s";if(io)io.observe(f);else f.classList.add("in")});
  }
  setTimeout(startReveal,rm?0:1600);
})();
</script>
